<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Дайсы - ДнД друг</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100dvh;
  font-family: Arial, sans-serif;
  color: white;
  overflow-x: hidden;

  background: linear-gradient(
    135deg,
    #0b1020,
    #3b0b5c,
    #b30059,
    #ff6b00
  );
  background-size: 400% 400%;
  animation: gradientMove 15s ease infinite;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* =================================
   ДЕКОРАТИВНЫЕ СИМВОЛЫ
   ================================= */

.decor-layer {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;

  pointer-events: none;
  overflow: hidden;

  z-index: 1;
}

.symbol {
  position: absolute;

  font-size: clamp(70px, 10vw, 140px);

  color: #ff4df0;
  opacity: 0.18;

  filter: drop-shadow(0 0 10px #ff4df0);

  animation:
    symbolPulse 6s ease-in-out infinite,
    symbolSpin 18s linear infinite;
}

@keyframes symbolPulse {
  0% {
    opacity: 0.12;
    filter: drop-shadow(0 0 7px #ff4df0);
  }

  50% {
    opacity: 0.28;
    filter: drop-shadow(0 0 22px #ff4df0);
  }

  100% {
    opacity: 0.12;
    filter: drop-shadow(0 0 7px #ff4df0);
  }
}

@keyframes symbolSpin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

.s1 { left: 5%; top: 15%; }
.s2 { right: 8%; top: 25%; animation-delay: 1s; }
.s3 { left: 12%; top: 55%; animation-delay: 2s; }
.s4 { right: 15%; top: 65%; animation-delay: 3s; }
.s5 { left: 20%; top: 75%; animation-delay: 4s; }
.s6 { right: 25%; top: 45%; animation-delay: 5s; }
.s7 { left: 30%; top: 35%; animation-delay: 6s; }
.s8 { right: 30%; top: 15%; animation-delay: 7s; }


/* =================================
   БОКОВОЕ МЕНЮ
   ================================= */

.side-menu {
  position: fixed;
  left: 0;
  top: 0;

  width: 60px;
  height: 100dvh;

  background: rgba(0, 0, 0, 0.88);

  border-right: 2px solid rgba(190, 60, 255, 0.8);

  z-index: 1000;

  overflow: hidden;

  transition: width 0.3s ease;
}

/*
   В ЗАКРЫТОМ МЕНЮ:
   показываем только кнопку ☰.
   Весь остальной контент полностью скрыт.
*/

.menu-content {
  position: absolute;

  left: 0;
  top: 70px;

  width: 250px;

  padding: 10px;

  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transform: translateX(-15px);

  transition:
    opacity 0.2s ease,
    transform 0.2s ease,
    visibility 0s linear 0.3s;
}

/*
   После открытия меню надписи появляются.
*/

.side-menu.open {
  width: 250px;
}

.side-menu.open .menu-content {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;

  transform: translateX(0);

  transition:
    opacity 0.25s ease 0.12s,
    transform 0.25s ease 0.12s,
    visibility 0s linear 0s;
}

.menu-button {
  position: relative;

  width: 60px;
  height: 60px;

  border: none;
  outline: none;

  background: transparent;
  color: white;

  font-size: 28px;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  z-index: 2;
}

.menu-content a,
.menu-content button {
  display: block;

  width: 100%;

  padding: 14px 16px;
  margin-bottom: 10px;

  color: white;
  text-decoration: none;
  text-align: left;

  background: rgba(255, 255, 255, 0.08);

  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 10px;

  cursor: pointer;

  font-size: 16px;

  transition: 0.2s;
}

.menu-content a:hover,
.menu-content button:hover {
  background: rgba(255, 77, 240, 0.25);

  border-color: #ff4df0;

  box-shadow: 0 0 12px rgba(255, 77, 240, 0.2);
}


/* =================================
   ОСНОВНОЙ КОНТЕНТ
   ================================= */

.main {
  position: relative;

  z-index: 10;

  min-height: 100dvh;

  padding:
    35px
    20px
    80px
    80px;

  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  margin: 10px 0 25px;

  text-align: center;

  font-size: clamp(32px, 6vw, 56px);

  text-shadow:
    0 0 10px #ff4df0,
    0 0 25px #ff4df0;
}


/* =================================
   КОНТЕЙНЕР
   ================================= */

.container {
  width: min(900px, 100%);

  padding: 25px;

  background: rgba(0, 0, 0, 0.45);

  border: 1px solid rgba(255, 255, 255, 0.15);

  border-radius: 20px;

  backdrop-filter: blur(8px);
}


/* =================================
   ПОЛЯ
   ================================= */

.input-area {
  display: flex;

  flex-wrap: wrap;

  gap: 10px;

  margin-bottom: 20px;
}

input {
  flex: 1;

  min-width: 180px;

  padding: 12px 15px;

  color: white;

  background: rgba(0, 0, 0, 0.5);

  border: 1px solid rgba(255, 255, 255, 0.25);

  border-radius: 10px;

  outline: none;

  font-size: 16px;
}

input:focus {
  border-color: #ff4df0;

  box-shadow:
    0 0 10px rgba(255, 77, 240, 0.4);
}

button {
  font-family: inherit;
}


/* =================================
   КНОПКИ
   ================================= */

.action-button {
  padding: 12px 18px;

  color: white;

  background: rgba(255, 77, 240, 0.2);

  border: 1px solid #ff4df0;

  border-radius: 10px;

  cursor: pointer;

  transition: 0.2s;

  font-size: 16px;
}

.action-button:hover {
  background: rgba(255, 77, 240, 0.4);

  box-shadow:
    0 0 15px rgba(255, 77, 240, 0.5);
}


/* =================================
   ДАЙСЫ
   ================================= */

.dice-grid {
  display: grid;

  grid-template-columns:
    repeat(auto-fit, minmax(100px, 1fr));

  gap: 15px;

  margin: 20px 0;
}

.dice-button {
  min-height: 80px;

  color: white;

  background: rgba(255, 255, 255, 0.08);

  border: 1px solid rgba(255, 255, 255, 0.2);

  border-radius: 15px;

  font-size: 20px;
  font-weight: bold;

  cursor: pointer;

  transition: 0.2s;
}

.dice-button:hover {
  transform: translateY(-3px);

  background: rgba(255, 77, 240, 0.25);

  border-color: #ff4df0;

  box-shadow:
    0 0 20px rgba(255, 77, 240, 0.35);
}


/* =================================
   КОЛИЧЕСТВО
   ================================= */

.count-section {
  margin: 20px 0;
}

.count-buttons {
  display: flex;

  flex-wrap: wrap;

  gap: 8px;

  margin-top: 10px;
}

.count-button {
  padding: 9px 14px;

  color: white;

  background: rgba(255, 255, 255, 0.08);

  border: 1px solid rgba(255, 255, 255, 0.2);

  border-radius: 8px;

  cursor: pointer;

  font-size: 15px;
}

.count-button.active,
.count-button:hover {
  background: rgba(255, 77, 240, 0.3);

  border-color: #ff4df0;
}


/* =================================
   РЕЖИМЫ
   ================================= */

.mode-section {
  margin: 20px 0;
}

.mode-buttons {
  display: flex;

  flex-wrap: wrap;

  gap: 10px;

  margin-top: 10px;
}

.mode-button {
  padding: 10px 15px;

  color: white;

  background: rgba(255, 255, 255, 0.08);

  border: 1px solid rgba(255, 255, 255, 0.2);

  border-radius: 9px;

  cursor: pointer;

  font-size: 15px;
}

.mode-button.active,
.mode-button:hover {
  background: rgba(255, 77, 240, 0.3);

  border-color: #ff4df0;
}


/* =================================
   ПОСЛЕДНИЙ БРОСОК
   ================================= */

.last-roll {
  margin-top: 25px;

  padding: 18px;

  background: rgba(0, 0, 0, 0.35);

  border-radius: 12px;

  text-align: center;

  font-size: 20px;
}


/* =================================
   ИСТОРИЯ
   ================================= */

.history {
  margin-top: 25px;
}

.history-list {
  max-height: 300px;

  overflow-y: auto;

  margin-top: 10px;
}

.history-item {
  padding: 10px;

  margin-bottom: 7px;

  background: rgba(255, 255, 255, 0.06);

  border-radius: 8px;
}


/* =================================
   ВСПЛЫВАЮЩЕЕ ОКНО
   ================================= */

.modal {
  position: fixed;

  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(0, 0, 0, 0.65);

  z-index: 5000;

  pointer-events: auto;
}

.modal.show {
  display: flex;
}

.modal-content {
  position: relative;

  width: min(500px, 100%);

  max-height: 90vh;

  overflow-y: auto;

  padding: 25px;

  color: white;

  background: rgba(20, 10, 35, 0.97);

  border: 1px solid #ff4df0;

  border-radius: 18px;

  box-shadow:
    0 0 25px rgba(255, 77, 240, 0.5),
    0 0 60px rgba(255, 77, 240, 0.2);

  pointer-events: auto;
}

.modal button,
.modal input,
.modal a {
  pointer-events: auto;
}


/* =================================
   HUD
   ================================= */

.hud {
  position: fixed;

  right: 15px;
  bottom: 15px;

  min-width: 220px;

  max-width:
    min(400px, calc(100vw - 30px));

  padding: 15px;

  background: rgba(0, 0, 0, 0.8);

  border: 1px solid rgba(255, 77, 240, 0.6);

  border-radius: 12px;

  z-index: 2000;

  box-shadow:
    0 0 15px rgba(255, 77, 240, 0.25);
}

.hud-result {
  font-size: 28px;

  font-weight: bold;

  text-align: center;
}

.hud-rolls {
  margin-top: 8px;

  font-size: 14px;

  opacity: 0.85;

  text-align: center;
}

.nat1 {
  color: #ff3333;
}

.nat20 {
  color: #33ff66;
}

.special {
  animation:
    specialBlink 0.7s infinite alternate;
}

@keyframes specialBlink {
  from {
    opacity: 0.5;
  }

  to {
    opacity: 1;
  }
}


/* =================================
   АНИМАЦИЯ КУБИКА
   ================================= */

.cube-animation {
  animation:
    cubeRoll 0.6s ease;
}

@keyframes cubeRoll {
  0% {
    transform:
      rotateY(0deg)
      rotateX(0deg)
      scale(1);
  }

  50% {
    transform:
      rotateY(180deg)
      rotateX(180deg)
      scale(1.15);
  }

  100% {
    transform:
      rotateY(360deg)
      rotateX(360deg)
      scale(1);
  }
}


/* =================================
   ТЕЛЕФОНЫ
   ================================= */

@media (max-width: 600px) {

  body {
    min-height: 100dvh;

    animation-duration: 20s;
  }

  /* Меню */

  .side-menu {
    width: 54px;

    height: 100dvh;

    background: rgba(0, 0, 0, 0.94);

    transition: width 0.25s ease;
  }

  .side-menu.open {
    width: min(250px, 82vw);
  }

  .menu-button {
    width: 54px;
    height: 58px;

    font-size: 27px;
  }

  .menu-content {
    width: min(250px, 82vw);

    top: 65px;

    padding: 9px;
  }

  .menu-content a,
  .menu-content button {
    padding: 13px 14px;

    min-height: 48px;

    font-size: 16px;
  }

  /* Основной контент */

  .main {
    width: 100%;

    min-height: 100dvh;

    padding:
      22px
      10px
      100px
      65px;
  }

  h1 {
    width: 100%;

    margin:
      5px
      0
      18px;

    font-size:
      clamp(30px, 9vw, 42px);
  }

  .container {
    width: 100%;

    padding: 15px;

    border-radius: 16px;
  }

  /* Поле */

  .input-area {
    flex-direction: column;

    gap: 8px;
  }

  input {
    width: 100%;

    min-width: 0;

    height: 48px;

    font-size: 16px;
  }

  .action-button {
    width: 100%;

    min-height: 46px;
  }

  /* Дайсы */

  .dice-grid {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));

    gap: 9px;

    margin: 15px 0;
  }

  .dice-button {
    min-height: 68px;

    font-size: 18px;

    border-radius: 12px;
  }

  /* Количество */

  .count-buttons {
    display: grid;

    grid-template-columns:
      repeat(3, 1fr);

    gap: 7px;
  }

  .count-button {
    min-height: 43px;

    padding: 7px;

    font-size: 14px;
  }

  /* Режимы */

  .mode-buttons {
    display: grid;

    grid-template-columns: 1fr;

    gap: 7px;
  }

  .mode-button {
    width: 100%;

    min-height: 44px;

    font-size: 14px;
  }

  /* Последний бросок */

  .last-roll {
    padding: 14px;

    margin-top: 18px;

    font-size: 17px;
  }

  /* История */

  .history {
    margin-top: 18px;
  }

  .history-list {
    max-height: 220px;
  }

  /* HUD */

  .hud {
    left: 65px;
    right: 10px;

    bottom:
      calc(10px + env(safe-area-inset-bottom));

    min-width: 0;

    width: auto;

    padding: 10px 12px;
  }

  .hud-result {
    font-size: 24px;
  }

  .hud-rolls {
    font-size: 13px;
  }

  /* Символы */

  .symbol {
    font-size: 65px;

    opacity: 0.10;
  }

  .s1 {
    left: 2%;
    top: 10%;
  }

  .s2 {
    right: 2%;
    top: 20%;
  }

  .s3 {
    left: 5%;
    top: 50%;
  }

  .s4 {
    right: 5%;
    top: 60%;
  }

  .s5 {
    left: 10%;
    top: 70%;
  }

  .s6 {
    right: 10%;
    top: 40%;
  }

  .s7 {
    left: 15%;
    top: 30%;
  }

  .s8 {
    right: 15%;
    top: 10%;
  }

  /* Модальное окно */

  .modal {
    padding:
      12px
      10px
      calc(12px + env(safe-area-inset-bottom));
  }

  .modal-content {
    width: 100%;

    max-height: 85dvh;

    padding: 20px;

    border-radius: 15px;
  }
}


/* =================================
   ОЧЕНЬ МАЛЕНЬКИЕ ЭКРАНЫ
   ================================= */

@media (max-width: 380px) {

  .main {
    padding-left: 62px;
    padding-right: 8px;
  }

  .container {
    padding: 12px;
  }

  .dice-grid {
    gap: 7px;
  }

  .dice-button {
    min-height: 62px;

    font-size: 17px;
  }

  .hud {
    left: 62px;
    right: 8px;
  }
}


/* =================================
   ОТКЛЮЧЕНИЕ АНИМАЦИЙ
   ================================= */

@media (prefers-reduced-motion: reduce) {

  body,
  .symbol {
    animation: none;
  }

  .dice-button:hover {
    transform: none;
  }
}
</style>
</head>

<body>

<!-- ДЕКОРАТИВНЫЕ СИМВОЛЫ -->

<div class="decor-layer">

<!-- БОКОВОЕ МЕНЮ -->

  <div class="menu-content">

<script>

/* =================================
   МЕНЮ
   ================================= */

const sideMenu =
  document.getElementById("sideMenu");

const menuButton =
  document.getElementById("menuButton");

const closeMenu =
  document.getElementById("closeMenu");


menuButton.addEventListener("click", () => {

  sideMenu.classList.toggle("open");

});


closeMenu.addEventListener("click", () => {

  sideMenu.classList.remove("open");

});


/* ESC */

document.addEventListener("keydown", (e) => {

  if (e.key === "Escape") {

    sideMenu.classList.remove("open");

  }

});


/* =================================
   SWIPE МЕНЮ
   ================================= */

let touchStartX = 0;
let touchEndX = 0;


document.addEventListener(
  "touchstart",
  (e) => {

    touchStartX =
      e.changedTouches[0].screenX;

  },
  { passive: true }
);


document.addEventListener(
  "touchend",
  (e) => {

    touchEndX =
      e.changedTouches[0].screenX;

    const difference =
      touchEndX - touchStartX;


    /* Свайп вправо от левого края */

    if (
      difference > 70 &&
      touchStartX < 80
    ) {

      sideMenu.classList.add("open");

    }


    /* Свайп влево */

    if (difference < -70) {

      sideMenu.classList.remove("open");

    }

  },
  { passive: true }
);


/* =================================
   ДАЙСЫ
   ================================= */

const baseDice =
  [4, 6, 8, 10, 12, 20, 100];

let customDice = null;

let selectedDice = null;

let diceCount = 1;

let mode = "normal";


const diceGrid =
  document.getElementById("diceGrid");

const customDiceInput =
  document.getElementById("customDiceInput");

const addDiceButton =
  document.getElementById("addDiceButton");

const duplicateWarning =
  document.getElementById("duplicateWarning");

const lastRoll =
  document.getElementById("lastRoll");

const historyList =
  document.getElementById("historyList");

const clearHistory =
  document.getElementById("clearHistory");

const hudResult =
  document.getElementById("hudResult");

const hudRolls =
  document.getElementById("hudRolls");

const modal =
  document.getElementById("modal");

const modalClose =
  document.getElementById("modalClose");

const modalBody =
  document.getElementById("modalBody");


/* =================================
   СОЗДАНИЕ КНОПОК ДАЙСОВ
   ================================= */

function renderDice() {

  diceGrid.innerHTML = "";

  const dice = [...baseDice];


  if (customDice !== null) {

    dice.push(customDice);

  }


  dice.forEach(sides => {

    const button =
      document.createElement("button");

    button.className =
      "dice-button";

    button.textContent =
      `D${sides}`;


    button.addEventListener(
      "click",
      () => {

        selectedDice = sides;

        rollDice();

      }
    );


    diceGrid.appendChild(button);

  });

}


renderDice();


/* =================================
   КАСТОМНЫЙ ДАЙС
   ================================= */

addDiceButton.addEventListener(
  "click",
  () => {

    const value =
      Number(customDiceInput.value);

    duplicateWarning.textContent = "";


    if (
      !Number.isInteger(value) ||
      value < 2 ||
      value > 10000
    ) {

      duplicateWarning.textContent =
        "Введите число от 2 до 10000";

      return;

    }


    if (baseDice.includes(value)) {

      duplicateWarning.textContent =
        "Такой дайс уже существует";

      return;

    }


    customDice = value;

    renderDice();

    customDiceInput.value = "";

  }
);


/* =================================
   КОЛИЧЕСТВО
   ================================= */

document
  .querySelectorAll(".count-button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".count-button")
          .forEach(btn =>
            btn.classList.remove("active")
          );


        button.classList.add("active");


        diceCount =
          Number(button.dataset.count);


        if (
          diceCount !== 1 &&
          mode !== "normal"
        ) {

          mode = "normal";


          document
            .querySelectorAll(".mode-button")
            .forEach(btn =>
              btn.classList.remove("active")
            );


          document
            .querySelector(
              '[data-mode="normal"]'
            )
            .classList.add("active");

        }

      }
    );

  });


/* =================================
   РЕЖИМЫ
   ================================= */

document
  .querySelectorAll(".mode-button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const selectedMode =
          button.dataset.mode;


        if (
          (
            selectedMode === "advantage" ||
            selectedMode === "disadvantage"
          )
          &&
          diceCount !== 1
        ) {

          showModal(
            "Преимущество и помеха работают только при броске одного дайса."
          );

          return;

        }


        document
          .querySelectorAll(".mode-button")
          .forEach(btn =>
            btn.classList.remove("active")
          );


        button.classList.add("active");


        mode = selectedMode;

      }
    );

  });


/* =================================
   СЛУЧАЙНОЕ ЧИСЛО
   ================================= */

function randomDice(sides) {

  return Math.floor(
    Math.random() * sides
  ) + 1;

}


/* =================================
   БРОСОК
   ================================= */

function rollDice() {

  if (!selectedDice) {
    return;
  }


  let rolls = [];

  let result = 0;


  if (mode === "normal") {

    for (
      let i = 0;
      i < diceCount;
      i++
    ) {

      rolls.push(
        randomDice(selectedDice)
      );

    }


    result =
      rolls.reduce(
        (sum, value) =>
          sum + value,
        0
      );

  }


  else if (mode === "advantage") {

    const first =
      randomDice(selectedDice);

    const second =
      randomDice(selectedDice);


    rolls = [
      first,
      second
    ];


    result =
      Math.max(first, second);

  }


  else if (mode === "disadvantage") {

    const first =
      randomDice(selectedDice);

    const second =
      randomDice(selectedDice);


    rolls = [
      first,
      second
    ];


    result =
      Math.min(first, second);

  }


  /* Анимация */

  hudResult.classList.remove(
    "cube-animation"
  );

  void hudResult.offsetWidth;

  hudResult.classList.add(
    "cube-animation"
  );


  /* Результат */

  lastRoll.textContent =
    `Последний бросок: D${selectedDice} → ${result}`;


  hudResult.textContent =
    result;


  hudRolls.textContent =
    rolls.length > 1
      ? `Броски: ${rolls.join(", ")}`
      : `D${selectedDice}`;


  /* Nat 1 / Nat 20 */

  hudResult.classList.remove(
    "nat1",
    "nat20",
    "special"
  );


  if (
    selectedDice === 20 &&
    diceCount === 1
  ) {

    if (rolls[0] === 1) {

      hudResult.classList.add(
        "nat1"
      );

    }


    if (rolls[0] === 20) {

      hudResult.classList.add(
        "nat20"
      );

    }


    if (
      rolls.includes(1) &&
      rolls.includes(20)
    ) {

      hudResult.classList.add(
        "special"
      );

    }

  }


  saveHistory({

    dice: selectedDice,

    count: diceCount,

    mode: mode,

    rolls: rolls,

    result: result,

    time:
      new Date().toLocaleTimeString()

  });

}


/* =================================
   ИСТОРИЯ
   ================================= */

function getHistory() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "diceHistory"
      )
    ) || [];

  }

  catch {

    return [];

  }

}


function saveHistory(entry) {

  let history =
    getHistory();


  history.unshift(entry);


  history =
    history.slice(0, 10);


  localStorage.setItem(
    "diceHistory",
    JSON.stringify(history)
  );


  renderHistory();

}


function renderHistory() {

  const history =
    getHistory();


  historyList.innerHTML = "";


  if (history.length === 0) {

    historyList.innerHTML =
      `<div class="history-item">
        История пуста
      </div>`;

    return;

  }


  history
    .slice(0, 5)
    .forEach(entry => {

      const item =
        document.createElement("div");


      item.className =
        "history-item";


      item.textContent =
        `${entry.time} — D${entry.dice} × ${entry.count} → ${entry.result}`;


      historyList.appendChild(item);

    });

}


renderHistory();


/* Очистить историю */

clearHistory.addEventListener(
  "click",
  () => {

    localStorage.removeItem(
      "diceHistory"
    );

    renderHistory();

  }
);


/* =================================
   ВСПЛЫВАЮЩЕЕ ОКНО
   ================================= */

function showModal(text) {

  modalBody.textContent = text;

  modal.classList.add("show");

}


function closeModal() {

  modal.classList.remove("show");

}


modalClose.addEventListener(
  "click",
  closeModal
);


/* Клик по затемнению */

modal.addEventListener(
  "click",
  (e) => {

    if (e.target === modal) {

      closeModal();

    }

  }
);


/* Escape */

document.addEventListener(
  "keydown",
  (e) => {

    if (e.key === "Escape") {

      closeModal();

    }

  }
);
/* СВОЁ КОЛИЧЕСТВО ДАЙСОВ */

const customCountButton =
  document.getElementById("customCountButton");

const customCountInput =
  document.getElementById("customCountInput");

customCountButton.addEventListener("click", () => {

  const value = Number(customCountInput.value);

  if (
    !Number.isInteger(value) ||
    value < 1 ||
    value > 1000
  ) {
    showModal("Введите количество от 1 до 1000.");
    return;
  }

  document
    .querySelectorAll(".count-button")
    .forEach(btn => btn.classList.remove("active"));

  customCountButton.classList.add("active");

  diceCount = value;

  if (diceCount !== 1 && mode !== "normal") {

    mode = "normal";

    document
      .querySelectorAll(".mode-button")
      .forEach(btn => btn.classList.remove("active"));

    document
      .querySelector('[data-mode="normal"]')
      .classList.add("active");
  }
});
</script>
