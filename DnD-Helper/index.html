<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>ДнД друг</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #fff;

      background:
        linear-gradient(
          135deg,
          #0b1020,
          #3b0b5c,
          #b30059,
          #ff6b00
        );

      background-size: 300% 300%;
      animation: gradientMove 15s ease infinite;

      overflow-x: hidden;
    }

    @keyframes gradientMove {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }


    /* =========================
       БОКОВОЕ МЕНЮ
    ========================= */

    #sideMenu {
      position: fixed;
      top: 0;
      left: 0;

      width: 60px;
      height: 100vh;
      height: 100dvh;

      background: rgba(0, 0, 0, 0.94);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      border-right: 2px solid #b300ff;

      z-index: 1000;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      transition:
        width 0.3s ease,
        box-shadow 0.3s ease;
    }

    #sideMenu.open {
      width: 250px;

      box-shadow:
        5px 0 30px rgba(0, 0, 0, 0.55);
    }


    /* Верх меню */

    #menuTop {
      height: 60px;
      min-height: 60px;

      padding: 10px;

      display: flex;
      align-items: center;
    }

    #menuDots {
      width: 40px;
      height: 40px;

      padding: 0;

      border: none;
      background: transparent;

      color: #fff;

      font-size: 32px;
      line-height: 1;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    #menuDots:hover {
      color: #ff4df0;
    }

    #menuDots span {
      display: block;
      width: 27px;
      height: 3px;
      background: #ffffff;
      border-radius: 2px;
    }

    #menuDots {
      flex-direction: column;
      gap: 5px;
    }


    /* =========================
       СОДЕРЖИМОЕ МЕНЮ
    ========================= */

    #menuContent {
      position: absolute;

      left: 0;
      top: 70px;

      width: 250px;

      padding: 10px;

      display: flex;
      flex-direction: column;
      gap: 12px;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transform: translateX(-15px);

      transition:
        opacity 0.2s ease,
        transform 0.2s ease,
        visibility 0s linear 0.3s;
    }

    #sideMenu.open #menuContent {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;

      transform: translateX(0);

      transition:
        opacity 0.25s ease 0.1s,
        transform 0.25s ease 0.1s,
        visibility 0s linear 0s;
    }

    #menuContent a,
    #menuContent button {
      width: 100%;

      min-height: 64px;

      padding: 12px 16px;

      background: #1a171d;

      border: 1px solid #403b43;
      border-radius: 12px;

      color: #f5f5f5;

      font-family: inherit;
      font-size: 1.08rem;
      font-weight: 600;

      text-decoration: none;
      text-align: left;

      cursor: pointer;

      display: flex;
      align-items: center;
      gap: 10px;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    #menuContent a:hover,
    #menuContent button:hover {
      background: #242026;

      border-color: #5b5360;

      transform: translateX(2px);

      box-shadow:
        0 0 15px rgba(255, 77, 240, 0.08);
    }


    /* =========================
       ОСНОВНОЙ КОНТЕНТ
    ========================= */

    .main {
      position: relative;
      z-index: 5;

      min-height: 100vh;
      min-height: 100dvh;

      padding:
        70px
        30px
        60px
        85px;

      text-align: center;

      transition:
        margin-left 0.3s ease;
    }

    .main.menu-open {
      margin-left: 250px;
    }


    /* =========================
       ЗАГОЛОВОК
    ========================= */

    .title {
      margin: 0 auto 40px;

      font-size: clamp(2.3rem, 5vw, 4rem);
      font-weight: 750;

      letter-spacing: 0.04em;

      text-shadow:
        0 0 10px rgba(0, 0, 0, 0.55),
        0 0 25px rgba(255, 77, 240, 0.3);
    }


    /* =========================
       ГЛАВНЫЕ КНОПКИ
    ========================= */

    .buttons {
      width: min(900px, 100%);

      margin: 0 auto;

      display: grid;

      grid-template-columns:
        repeat(2, minmax(200px, 1fr));

      gap: 18px;
    }

    .menu-btn {
      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;

      min-height: 65px;

      padding: 15px 20px;

      background:
        rgba(255, 255, 255, 0.14);

      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;

      color: #fff;

      font-size: 1.2rem;
      font-weight: 600;

      text-decoration: none;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.18);

      overflow: hidden;

      transition:
        transform 0.22s ease,
        background 0.22s ease,
        box-shadow 0.22s ease,
        border-color 0.22s ease;
    }

    .menu-btn::before {
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          120deg,
          transparent,
          rgba(255, 255, 255, 0.12),
          transparent
        );

      transform: translateX(-100%);

      transition:
        transform 0.5s ease;
    }

    .menu-btn:hover {
      background:
        rgba(255, 255, 255, 0.25);

      border-color:
        rgba(255, 77, 240, 0.45);

      transform:
        translateY(-4px);

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.3),
        0 0 20px rgba(255, 77, 240, 0.18);
    }

    .menu-btn:hover::before {
      transform: translateX(100%);
    }

    .menu-btn:active {
      transform:
        translateY(-1px) scale(0.98);
    }


    /* =========================
       ИНФОРМАЦИОННЫЙ БЛОК
    ========================= */

    .decor-box {
      width: min(700px, 100%);

      margin: 45px auto 0;

      padding: 25px;

      background:
        rgba(255, 255, 255, 0.11);

      border:
        1px solid rgba(255, 255, 255, 0.1);

      border-radius: 16px;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      box-shadow:
        0 0 25px rgba(0, 0, 0, 0.3);

      font-size: 1.05rem;
      line-height: 1.65;

      text-align: center;
    }


    /* =========================
       ДЕКОРАТИВНЫЕ СИМВОЛЫ
    ========================= */

    .decor-layer {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      overflow: hidden;

      z-index: 1;
    }

    .symbol {
      position: absolute;

      font-size: clamp(70px, 10vw, 140px);

      color: #ff4df0;

      opacity: 0.18;

      filter:
        drop-shadow(0 0 10px #ff4df0);

      animation:
        pulse 6s ease-in-out infinite,
        spin 18s linear infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 0.12;

        filter:
          drop-shadow(0 0 6px #ff4df0);
      }

      50% {
        opacity: 0.28;

        filter:
          drop-shadow(0 0 20px #ff4df0);
      }

      100% {
        opacity: 0.12;

        filter:
          drop-shadow(0 0 6px #ff4df0);
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .s1 {
      left: 5%;
      top: 15%;
    }

    .s2 {
      right: 8%;
      top: 25%;
      animation-delay: 1s;
    }

    .s3 {
      left: 12%;
      top: 55%;
      animation-delay: 2s;
    }

    .s4 {
      right: 15%;
      top: 65%;
      animation-delay: 3s;
    }

    .s5 {
      left: 20%;
      top: 75%;
      animation-delay: 4s;
    }

    .s6 {
      right: 25%;
      top: 45%;
      animation-delay: 5s;
    }

    .s7 {
      left: 30%;
      top: 35%;
      animation-delay: 6s;
    }

    .s8 {
      right: 30%;
      top: 15%;
      animation-delay: 7s;
    }


    /* =========================
       ТЕЛЕФОН
    ========================= */

    @media (max-width: 700px) {

      #sideMenu {
        width: 54px;

        background: #050308;

        border-right: none;

        transition:
          width 0.25s ease;
      }

      /*
        На телефоне открытое меню
        занимает весь экран, как на скриншоте
      */

      #sideMenu.open {
        width: 100vw;

        box-shadow: none;
      }

      #menuTop {
        height: 60px;
        min-height: 60px;

        padding:
          7px 18px;
      }

      #menuDots {
        width: 38px;
        height: 38px;

        font-size: 0;
      }

      #menuDots::before {
        display: none;
      }

      #sideMenu.open #menuDots::before {
        content: "☰";
      }


      #menuContent {
        position: absolute;

        left: 0;
        top: 70px;

        width: 100%;

        padding:
          10px 13px;

        gap: 12px;

        transform: translateX(-10px);
      }

      #sideMenu.open #menuContent {
        transform: translateX(0);
      }

      #menuContent a,
      #menuContent button {
        min-height: 64px;

        padding:
          12px 18px;

        background: #1a171d;

        border:
          1px solid #403b43;

        border-radius: 12px;

        font-size: 1.08rem;
        font-weight: 600;

        gap: 10px;
      }


      /* Основной контент */

      .main {
        padding:
          45px
          15px
          50px
          68px;

        transition: none;
      }

      .main.menu-open {
        margin-left: 0;
      }


      .title {
        font-size: 2rem;

        margin-bottom: 30px;
      }


      .buttons {
        grid-template-columns: 1fr;

        width: 100%;

        gap: 12px;
      }

      .menu-btn {
        width: 100%;

        min-height: 58px;

        padding: 13px 15px;

        font-size: 1.05rem;
      }


      .decor-box {
        width: 100%;

        margin-top: 32px;

        padding: 18px;

        font-size: 0.98rem;

        line-height: 1.5;
      }


      .symbol {
        font-size: 70px;

        opacity: 0.11;
      }

      .s1 {
        left: 2%;
        top: 10%;
      }

      .s2 {
        right: 2%;
        top: 20%;
      }

      .s3 {
        left: 5%;
        top: 50%;
      }

      .s4 {
        right: 5%;
        top: 60%;
      }

      .s5 {
        left: 10%;
        top: 70%;
      }

      .s6 {
        right: 10%;
        top: 40%;
      }

      .s7 {
        left: 15%;
        top: 30%;
      }

      .s8 {
        right: 15%;
        top: 10%;
      }
    }


    /* =========================
       ОЧЕНЬ МАЛЕНЬКИЕ ЭКРАНЫ
    ========================= */

    @media (max-width: 380px) {

      .main {
        padding-left: 62px;
        padding-right: 10px;
      }

      .title {
        font-size: 1.7rem;
      }

      .decor-box {
        font-size: 0.93rem;
      }

      #menuContent {
        padding-left: 13px;
        padding-right: 13px;
      }
    }


    /* =========================
       УМЕНЬШЕНИЕ АНИМАЦИЙ
    ========================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;

        transition-duration: 0.01ms !important;

        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       БОКОВОЕ МЕНЮ
  ========================= -->

  <aside id="sideMenu">

    <div id="menuTop">
      <button
        id="menuDots"
        type="button"
        aria-label="Открыть меню"
        aria-expanded="false"
        onclick="toggleMenu()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>


   <nav id="menuContent">

  <a href="index.html">
    🏠
    <span>Главная</span>
  </a>

  <a href="dices.html">
    🎲
    <span>Дайсы</span>
  </a>

  <a href="Initiative.html">
    🎯
    <span>Инициатива</span>
  </a>

  <a href="Notes.html">
    📝
    <span>Заметки</span>
  </a>

  <a href="Monstr.html">
    👹
    <span>Монстры</span>
  </a>

  <a href="Loot.html">
    💰
    <span>Лут</span>
  </a>

  <button
    type="button"
    onclick="toggleMenu(false)"
  >
    <span style="font-size: 25px;">×</span>
    <span>Закрыть</span>
  </button>

</nav>

  </aside>


  <!-- =========================
       ДЕКОРАТИВНЫЕ СИМВОЛЫ
  ========================= -->

  <div class="decor-layer">

    <div class="symbol s1">⭘</div>
    <div class="symbol s2">ᛉ</div>
    <div class="symbol s3">⚚</div>
    <div class="symbol s4">✦</div>
    <div class="symbol s5">⬢</div>
    <div class="symbol s6">ᛟ</div>
    <div class="symbol s7">⯁</div>
    <div class="symbol s8">⚔️</div>

  </div>


  <!-- =========================
       ОСНОВНОЙ КОНТЕНТ
  ========================= -->

  <main class="main" id="mainContent">

    <h1 class="title">
      ДнД друг
    </h1>


    <div class="buttons">

      <a href="dices.html" class="menu-btn">
        Дайсы
      </a>

      <a href="Initiative.html" class="menu-btn">
        Инициатива
      </a>

      <a href="Monstr.html" class="menu-btn">
        Монстры
      </a>

      <a href="Loot.html" class="menu-btn">
        Лут
      </a>

    </div>


    <a href="Notes.html" class="menu-btn" style="width: min(430px, 100%); margin: 22px auto 0;">
      Заметки
    </a>


    <div class="decor-box">

      Здесь ты найдёшь всё необходимое
      для своей игры или её проведения.

      <br><br>

      Дайсы уже доступны, а остальные
      инструменты скоро появятся.

      <br><br>

      Удачи тебе, путник.

    </div>

  </main>


  <script>

    const menu = document.getElementById("sideMenu");
    const main = document.getElementById("mainContent");
    const menuButton = document.getElementById("menuDots");


    function toggleMenu(forceState = null) {

      const isOpen =
        forceState !== null
          ? forceState
          : !menu.classList.contains("open");


      menu.classList.toggle("open", isOpen);

      main.classList.toggle("menu-open", isOpen);

      menuButton.setAttribute(
        "aria-expanded",
        isOpen
      );

      menuButton.setAttribute(
        "aria-label",
        isOpen
          ? "Закрыть меню"
          : "Открыть меню"
      );
    }


    /* =========================
       СВАЙП НА ТЕЛЕФОНЕ
    ========================= */

    let touchStartX = 0;
    let touchStartY = 0;


    document.addEventListener(
      "touchstart",
      function(event) {

        const touch = event.changedTouches[0];

        touchStartX = touch.clientX;
        touchStartY = touch.clientY;

      },
      { passive: true }
    );


    document.addEventListener(
      "touchend",
      function(event) {

        const touch = event.changedTouches[0];

        const diffX =
          touch.clientX - touchStartX;

        const diffY =
          touch.clientY - touchStartY;


        if (
          Math.abs(diffX) < Math.abs(diffY)
        ) {
          return;
        }


        /* Открытие меню */

        if (
          touchStartX < 50 &&
          diffX > 60
        ) {

          toggleMenu(true);

        }


        /* Закрытие меню */

        else if (
          menu.classList.contains("open") &&
          diffX < -60
        ) {

          toggleMenu(false);

        }

      },
      { passive: true }
    );


    /* =========================
       ESC
    ========================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {
          toggleMenu(false);
        }

      }
    );

  </script>

</body>
</html>
