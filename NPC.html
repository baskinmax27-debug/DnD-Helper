<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>NPC - ДнД друг</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #fff;

      background:
        linear-gradient(
          135deg,
          #0b1020,
          #3b0b5c,
          #b30059,
          #ff6b00
        );

      background-size: 300% 300%;
      animation: gradientMove 15s ease infinite;

      overflow-x: hidden;
    }

    @keyframes gradientMove {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }


    /* =========================
       БОКОВОЕ МЕНЮ
    ========================= */

    #sideMenu {
      position: fixed;
      top: 0;
      left: 0;

      width: 60px;
      height: 100vh;
      height: 100dvh;

      background: rgba(0, 0, 0, 0.94);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      border-right: 2px solid #b300ff;

      z-index: 1000;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      transition:
        width 0.3s ease,
        box-shadow 0.3s ease;
    }

    #sideMenu.open {
      width: 250px;

      box-shadow:
        5px 0 30px rgba(0, 0, 0, 0.55);
    }


    /* Верх меню */

    #menuTop {
      height: 60px;
      min-height: 60px;

      padding: 10px;

      display: flex;
      align-items: center;
    }

    #menuDots {
      width: 40px;
      height: 40px;

      padding: 0;

      border: none;
      background: transparent;

      color: #fff;

      font-size: 32px;
      line-height: 1;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    #menuDots:hover {
      color: #ff4df0;
    }

    #menuDots span {
      display: block;
      width: 27px;
      height: 3px;
      background: #ffffff;
      border-radius: 2px;
    }

    #menuDots {
      flex-direction: column;
      gap: 5px;
    }


    /* =========================
       СОДЕРЖИМОЕ МЕНЮ
    ========================= */

    #menuContent {
      position: absolute;

      left: 0;
      top: 70px;

      width: 250px;

      padding: 10px;

      display: flex;
      flex-direction: column;
      gap: 12px;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transform: translateX(-15px);

      transition:
        opacity 0.2s ease,
        transform 0.2s ease,
        visibility 0s linear 0.3s;
    }

    #sideMenu.open #menuContent {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;

      transform: translateX(0);

      transition:
        opacity 0.25s ease 0.1s,
        transform 0.25s ease 0.1s,
        visibility 0s linear 0s;
    }

    #menuContent a,
    #menuContent button {
      width: 100%;

      min-height: 64px;

      padding: 12px 16px;

      background: #1a171d;

      border: 1px solid #403b43;
      border-radius: 12px;

      color: #f5f5f5;

      font-family: inherit;
      font-size: 1.08rem;
      font-weight: 600;

      text-decoration: none;
      text-align: left;

      cursor: pointer;

      display: flex;
      align-items: center;
      gap: 10px;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    #menuContent a:hover,
    #menuContent button:hover {
      background: #242026;

      border-color: #5b5360;

      transform: translateX(2px);

      box-shadow:
        0 0 15px rgba(255, 77, 240, 0.08);
    }


    /* =========================
       ОСНОВНОЙ КОНТЕНТ
    ========================= */

    .main {
      position: relative;
      z-index: 5;

      min-height: 100vh;
      min-height: 100dvh;

      padding:
        70px
        30px
        60px
        85px;

      text-align: center;

      transition:
        margin-left 0.3s ease;
    }

    .main.menu-open {
      margin-left: 250px;
    }


    /* =========================
       ЗАГОЛОВОК
    ========================= */

    .title {
      margin: 0 auto 40px;

      font-size: clamp(2.3rem, 5vw, 4rem);
      font-weight: 750;

      letter-spacing: 0.04em;

      text-shadow:
        0 0 10px rgba(0, 0, 0, 0.55),
        0 0 25px rgba(255, 77, 240, 0.3);
    }


    /* =========================
       ГЛАВНЫЕ КНОПКИ
    ========================= */

    .buttons {
      width: min(900px, 100%);

      margin: 0 auto;

      display: grid;

      grid-template-columns:
        repeat(2, minmax(200px, 1fr));

      gap: 18px;
    }

    .menu-btn {
      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;

      min-height: 65px;

      padding: 15px 20px;

      background:
        rgba(255, 255, 255, 0.14);

      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;

      color: #fff;

      font-size: 1.2rem;
      font-weight: 600;

      text-decoration: none;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.18);

      overflow: hidden;

      transition:
        transform 0.22s ease,
        background 0.22s ease,
        box-shadow 0.22s ease,
        border-color 0.22s ease;
    }

    .menu-btn::before {
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          120deg,
          transparent,
          rgba(255, 255, 255, 0.12),
          transparent
        );

      transform: translateX(-100%);

      transition:
        transform 0.5s ease;
    }

    .menu-btn:hover {
      background:
        rgba(255, 255, 255, 0.25);

      border-color:
        rgba(255, 77, 240, 0.45);

      transform:
        translateY(-4px);

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.3),
        0 0 20px rgba(255, 77, 240, 0.18);
    }

    .menu-btn:hover::before {
      transform: translateX(100%);
    }

    .menu-btn:active {
      transform:
        translateY(-1px) scale(0.98);
    }


    /* =========================
       ИНФОРМАЦИОННЫЙ БЛОК
    ========================= */

    .decor-box {
      width: min(700px, 100%);

      margin: 45px auto 0;

      padding: 25px;

      background:
        rgba(255, 255, 255, 0.11);

      border:
        1px solid rgba(255, 255, 255, 0.1);

      border-radius: 16px;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      box-shadow:
        0 0 25px rgba(0, 0, 0, 0.3);

      font-size: 1.05rem;
      line-height: 1.65;

      text-align: center;
    }


    /* =========================
       ДЕКОРАТИВНЫЕ СИМВОЛЫ
    ========================= */

    .decor-layer {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      overflow: hidden;

      z-index: 1;
    }

    .symbol {
      position: absolute;

      font-size: clamp(70px, 10vw, 140px);

      color: #ff4df0;

      opacity: 0.18;

      filter:
        drop-shadow(0 0 10px #ff4df0);

      animation:
        pulse 6s ease-in-out infinite,
        spin 18s linear infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 0.12;

        filter:
          drop-shadow(0 0 6px #ff4df0);
      }

      50% {
        opacity: 0.28;

        filter:
          drop-shadow(0 0 20px #ff4df0);
      }

      100% {
        opacity: 0.12;

        filter:
          drop-shadow(0 0 6px #ff4df0);
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .s1 {
      left: 5%;
      top: 15%;
    }

    .s2 {
      right: 8%;
      top: 25%;
      animation-delay: 1s;
    }

    .s3 {
      left: 12%;
      top: 55%;
      animation-delay: 2s;
    }

    .s4 {
      right: 15%;
      top: 65%;
      animation-delay: 3s;
    }

    .s5 {
      left: 20%;
      top: 75%;
      animation-delay: 4s;
    }

    .s6 {
      right: 25%;
      top: 45%;
      animation-delay: 5s;
    }

    .s7 {
      left: 30%;
      top: 35%;
      animation-delay: 6s;
    }

    .s8 {
      right: 30%;
      top: 15%;
      animation-delay: 7s;
    }


    /* =========================
       ТЕЛЕФОН
    ========================= */

    @media (max-width: 700px) {

      #sideMenu {
        width: 54px;

        background: #050308;

        border-right: none;

        transition:
          width 0.25s ease;
      }

      /*
        На телефоне открытое меню
        занимает весь экран, как на скриншоте
      */

      #sideMenu.open {
        width: 100vw;

        box-shadow: none;
      }

      #menuTop {
        height: 60px;
        min-height: 60px;

        padding:
          7px 18px;
      }

      #menuDots {
        width: 38px;
        height: 38px;

        font-size: 0;
      }

      #menuDots::before {
        display: none;
      }

      #sideMenu.open #menuDots::before {
        content: "☰";
      }


      #menuContent {
        position: absolute;

        left: 0;
        top: 70px;

        width: 100%;

        padding:
          10px 13px;

        gap: 12px;

        transform: translateX(-10px);
      }

      #sideMenu.open #menuContent {
        transform: translateX(0);
      }

      #menuContent a,
      #menuContent button {
        min-height: 64px;

        padding:
          12px 18px;

        background: #1a171d;

        border:
          1px solid #403b43;

        border-radius: 12px;

        font-size: 1.08rem;
        font-weight: 600;

        gap: 10px;
      }


      /* Основной контент */

      .main {
        padding:
          45px
          15px
          50px
          68px;

        transition: none;
      }

      .main.menu-open {
        margin-left: 0;
      }


      .title {
        font-size: 2rem;

        margin-bottom: 30px;
      }


      .buttons {
        grid-template-columns: 1fr;

        width: 100%;

        gap: 12px;
      }

      .menu-btn {
        width: 100%;

        min-height: 58px;

        padding: 13px 15px;

        font-size: 1.05rem;
      }


      .decor-box {
        width: 100%;

        margin-top: 32px;

        padding: 18px;

        font-size: 0.98rem;

        line-height: 1.5;
      }


      .symbol {
        font-size: 70px;

        opacity: 0.11;
      }

      .s1 {
        left: 2%;
        top: 10%;
      }

      .s2 {
        right: 2%;
        top: 20%;
      }

      .s3 {
        left: 5%;
        top: 50%;
      }

      .s4 {
        right: 5%;
        top: 60%;
      }

      .s5 {
        left: 10%;
        top: 70%;
      }

      .s6 {
        right: 10%;
        top: 40%;
      }

      .s7 {
        left: 15%;
        top: 30%;
      }

      .s8 {
        right: 15%;
        top: 10%;
      }
    }


    /* =========================
       ОЧЕНЬ МАЛЕНЬКИЕ ЭКРАНЫ
    ========================= */

    @media (max-width: 380px) {

      .main {
        padding-left: 62px;
        padding-right: 10px;
      }

      .title {
        font-size: 1.7rem;
      }

      .decor-box {
        font-size: 0.93rem;
      }

      #menuContent {
        padding-left: 13px;
        padding-right: 13px;
      }
    }


    /* =========================
       УМЕНЬШЕНИЕ АНИМАЦИЙ
    ========================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;

        transition-duration: 0.01ms !important;

        scroll-behavior: auto !important;
      }
    }
  
    /* =========================
       NPC
    ========================= */

    .confirm-overlay {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .confirm-overlay.show { display: flex; }

    .confirm-box {
      width: min(430px, 100%);
      padding: 22px;
      border-radius: 16px;
      background: #17131c;
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
      text-align: center;
    }

    .confirm-box h3 { margin: 0 0 10px; font-size: 1.3rem; }
    .confirm-box p { margin: 0; line-height: 1.5; opacity: .85; }
    .confirm-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .npc-wrap {
      width: min(1100px, 100%);
      margin: 0 auto;
      text-align: left;
    }

    .npc-toolbar, .npc-card, .generator-card {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px;
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
      box-shadow: 0 8px 25px rgba(0,0,0,.2);
    }

    .generator-card, .npc-toolbar { padding: 18px; margin-bottom: 18px; }
    .section-title { margin: 0 0 14px; font-size: 1.35rem; }
    .hint { opacity: .78; font-size: .92rem; margin: -5px 0 14px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 12px;
    }

    .field { display:flex; flex-direction:column; gap:6px; }
    .field.wide { grid-column: 1 / -1; }
    label { font-size:.9rem; opacity:.9; }

    input, select, textarea {
      width:100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(10,8,18,.72);
      color:#fff;
      font: inherit;
      outline:none;
    }
    textarea { min-height:82px; resize:vertical; }
    input:focus, select:focus, textarea:focus { border-color:#ff4df0; }

    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
    .action-btn {
      border:1px solid rgba(255,255,255,.18);
      border-radius:10px;
      background:rgba(255,255,255,.15);
      color:#fff;
      padding:10px 14px;
      font:inherit;
      font-weight:650;
      cursor:pointer;
    }
    .action-btn:hover { background:rgba(255,255,255,.24); }
    .action-btn.primary { border-color:rgba(255,77,240,.55); }
    .action-btn.danger { border-color:rgba(255,100,100,.45); }

    .npc-toolbar {
      display:grid;
      grid-template-columns: minmax(220px,1fr) 170px 170px 170px auto;
      gap:10px;
    }

    .npc-list { display:grid; gap:12px; }
    .npc-card { overflow:hidden; }
    .npc-summary {
      width:100%;
      border:0;
      color:#fff;
      background:transparent;
      padding:15px 17px;
      display:flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
      text-align:left;
      font:inherit;
    }
    .npc-summary:hover { background:rgba(255,255,255,.06); }
    .npc-main { min-width:0; flex:1; }
    .npc-name { font-weight:750; font-size:1.08rem; }
    .npc-short { opacity:.78; margin-top:3px; font-size:.92rem; }
    .star { font-size:1.25rem; }
    .npc-details { display:none; padding:0 17px 17px; border-top:1px solid rgba(255,255,255,.1); }
    .npc-card.open .npc-details { display:block; }
    .details-grid {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px 18px;
      padding-top:14px;
    }
    .detail { line-height:1.45; }
    .detail b { opacity:.78; }
    .detail.wide { grid-column:1/-1; white-space:pre-wrap; }
    .empty { text-align:center; opacity:.75; padding:28px 10px; }

    .edit-title { margin:16px 0 10px; font-size:1rem; }
    .edit-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .edit-grid .wide { grid-column:1/-1; }


    .archive-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      margin-left: 6px;
      border-radius: 999px;
      font-size: .78rem;
      background: rgba(255,255,255,.12);
      opacity: .85;
    }

    .npc-card.archived { opacity: .72; }

    @media (max-width: 1000px) {
      .npc-toolbar { grid-template-columns: 1fr 1fr; }
      .npc-toolbar input { grid-column: 1 / -1; }
    }

    @media (max-width: 850px) {
      .form-grid, .edit-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .npc-toolbar { grid-template-columns:1fr 1fr; }
      .npc-toolbar input { grid-column:1/-1; }
    }

    @media (max-width: 700px) {
      .form-grid, .edit-grid, .details-grid { grid-template-columns:1fr; }
      .field.wide, .detail.wide, .edit-grid .wide { grid-column:auto; }
      .npc-toolbar { grid-template-columns:1fr; }
      .npc-toolbar input { grid-column:auto; }
      .generator-card, .npc-toolbar { padding:14px; }
    }

  </style>
</head>

<body>

  <!-- =========================
       БОКОВОЕ МЕНЮ
  ========================= -->

  <aside id="sideMenu">

    <div id="menuTop">
      <button
        id="menuDots"
        type="button"
        aria-label="Открыть меню"
        aria-expanded="false"
        onclick="toggleMenu()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>


   <nav id="menuContent">

  <a href="index.html">
    🏠
    <span>Главная</span>
  </a>

  <a href="dices.html">
    🎲
    <span>Дайсы</span>
  </a>

  <a href="Initiative.html">
    🎯
    <span>Инициатива</span>
  </a>

  <a href="Notes.html">
    📝
    <span>Заметки</span>
  </a>

  <a href="Monstr.html">
    👹
    <span>Монстры</span>
  </a>

  <a href="Loot.html">
    💰
    <span>Лут</span>
  </a>

  <a href="NPC.html">
    🎭
    <span>NPC</span>
  </a>

  <button
    type="button"
    onclick="toggleMenu(false)"
  >
    <span style="font-size: 25px;">×</span>
    <span>Закрыть</span>
  </button>

</nav>

  </aside>


  <!-- =========================
       ДЕКОРАТИВНЫЕ СИМВОЛЫ
  ========================= -->

  <div class="decor-layer">

    <div class="symbol s1">⭘</div>
    <div class="symbol s2">ᛉ</div>
    <div class="symbol s3">⚚</div>
    <div class="symbol s4">✦</div>
    <div class="symbol s5">⬢</div>
    <div class="symbol s6">ᛟ</div>
    <div class="symbol s7">⯁</div>
    <div class="symbol s8">⚔️</div>

  </div>


  <!-- =========================
       ОСНОВНОЙ КОНТЕНТ
  ========================= -->

  <main class="main" id="mainContent">
    <h1 class="title">🎭 NPC</h1>

    <div class="npc-wrap">
      <section class="generator-card">
        <h2 class="section-title">Генератор NPC</h2>
        <p class="hint">Оставь поле на «🎲 Случайно», чтобы сайт придумал его сам. Всё, что укажешь вручную, останется неизменным.</p>

        <div class="form-grid">
          <div class="field">
            <label for="genName">Имя</label>
            <input id="genName" placeholder="🎲 Случайно">
          </div>

          <div class="field">
            <label for="genRace">Раса</label>
            <select id="genRace">
              <option value="">🎲 Случайно</option>

  <script>
    const menu = document.getElementById("sideMenu");
    const main = document.getElementById("mainContent");
    const menuButton = document.getElementById("menuDots");

    function toggleMenu(forceState = null) {
      const isOpen = forceState !== null ? forceState : !menu.classList.contains("open");
      menu.classList.toggle("open", isOpen);
      main.classList.toggle("menu-open", isOpen);
      menuButton.setAttribute("aria-expanded", isOpen);
      menuButton.setAttribute("aria-label", isOpen ? "Закрыть меню" : "Открыть меню");
    }

    let touchStartX = 0, touchStartY = 0;
    document.addEventListener("touchstart", e => {
      const t=e.changedTouches[0]; touchStartX=t.clientX; touchStartY=t.clientY;
    }, {passive:true});
    document.addEventListener("touchend", e => {
      const t=e.changedTouches[0], dx=t.clientX-touchStartX, dy=t.clientY-touchStartY;
      if (Math.abs(dx)<Math.abs(dy)) return;
      if (touchStartX<50 && dx>60) toggleMenu(true);
      else if (menu.classList.contains("open") && dx<-60) toggleMenu(false);
    }, {passive:true});
    document.addEventListener("keydown", e => { if(e.key==="Escape") toggleMenu(false); });

    const NPC_KEY = "dndFriendNPCs";
    let npcs = loadNPCs();

    const data = {
      races:["Ааракокра","Аасимар","Автогном","Астральный эльф","Багбир","Ведалкен","Вердан","Гибрид Симиков","Гит","Гифф","Гном","Гоблин","Голиаф","Грунг","Дварф","Дженази","Драконорождённый","Зайцегон","Калаштар","Кендер","Кенку","Кентавр","Кобольд","Кованый","Леонин","Локата","Локсодон","Людоящер","Минотавр","Орк","Плазмоид","Полуорк","Полурослик","Полуэльф","Сатир","Совлин","Табакси","Тифлинг","Тортл","Три-крин","Тритон","Фирболг","Фэйри","Хадози","Хобгоблин","Чейнджлинг","Человек","Шифтер","Эльф","Юань-ти","Глубинный гном","Дуэргар","Морской эльф","Шадар-кай","Эладрин","Гитцерай","Гитъянки","Ведьмовская кровь","Возрождённый","Дампир","Своё происхождение"],

      ],

      traits:[

      ],
      voices:[
        "Говорит медленно и тщательно подбирает слова",
        "Разговаривает очень быстро, почти не делая пауз",
        "Часто понижает голос до шёпота",
        "Обращается ко всем исключительно на «вы»",
        "Постоянно вставляет в речь пословицы",
        "Говорит короткими рублеными фразами",
        "Смеётся после собственных фраз",
        "Растягивает последние слова в предложении",
        "Говорит громко, будто всё время выступает перед толпой",
        "Перед ответом всегда произносит «Хм-м-м…»"
      ]
    };

    const maleNames = {
      "Человек":["Альрик","Бран","Гаррет","Теодор","Марек","Роланд","Эдгар","Дариан"],
      "Эльф":["Аэлар","Тариэль","Элрон","Фаэлар","Иваэль","Лаэрон"],
      "Полуэльф":["Кайлен","Эриан","Лоран","Сайлас","Терен"],
      "Дварф":["Борин","Дурек","Торвин","Бром","Харгрим"],
      "Халфлинг":["Мило","Перрин","Тобин","Финнан","Коррин"],
      "Гном":["Бимбл","Ним","Физзик","Орин","Вилби"],
      "Полуорк":["Гарок","Торг","Ругар","Мог","Харг"],
      "Тифлинг":["Дамакос","Мордай","Акменос","Левкис","Зефир"],
      "Драконорождённый":["Арджхан","Баласар","Геш","Криваак","Тархун"]
    };
    const femaleNames = {
      "Человек":["Мира","Элина","Селена","Адель","Лиана","Ровена","Клара","Иветта"],
      "Эльф":["Лиадрин","Аэлина","Сильвара","Наиварра","Иеленна"],
      "Полуэльф":["Лира","Эвелин","Сера","Найла","Мелия"],
      "Дварф":["Хильда","Висса","Артин","Торбера","Гурдис"],
      "Халфлинг":["Рози","Калли","Серафина","Лидда","Мерла"],
      "Гном":["Брина","Карлин","Лупмоттин","Нисса","Тана"],
      "Полуорк":["Шаата","Ренда","Евельда","Мурген","Багги"],
      "Тифлинг":["Каллиста","Макария","Акта","Криэлла","Немия"],
      "Драконорождённый":["Аккра","Бирин","Фариде","Хавилар","Сора"]
    };

    function loadNPCs(){
      try { return JSON.parse(localStorage.getItem(NPC_KEY)) || []; }
      catch { return []; }
    }
    function persist(){ localStorage.setItem(NPC_KEY, JSON.stringify(npcs)); }
    function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
    function val(id){ return document.getElementById(id).value.trim(); }
    function setVal(id,v){ document.getElementById(id).value=v ?? ""; }
    function uid(){ return crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random().toString(16).slice(2); }

    function randomAge(race){
      const ranges={
        "Человек":[18,75],"Эльф":[40,650],"Полуэльф":[18,160],"Дварф":[35,300],
        "Халфлинг":[20,120],"Гном":[35,350],"Полуорк":[14,70],
        "Тифлинг":[18,90],"Драконорождённый":[15,80]
      };
      const [a,b]=ranges[race]||[18,80];
      return Math.floor(Math.random()*(b-a+1))+a;
    }

    function randomName(race,gender){
      const pool = gender==="Женщина" ? femaleNames : maleNames;
      return pick(pool[race] || pool["Человек"]);
    }

    const generatorFields = [
      "genName","genRace","genGender","genAge","genProfession","genAppearance",
      "genCharacter","genTrait","genAttitude","genGoal","genSecret","genVoice"
    ];
    const userLocked = new Set();

    generatorFields.forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener("input", () => {
        if (el.value.trim()) userLocked.add(id);
        else userLocked.delete(id);
      });
      el.addEventListener("change", () => {
        if (el.value.trim()) userLocked.add(id);
        else userLocked.delete(id);
      });
    });

    function generateNPC(){
      const race = userLocked.has("genRace") && val("genRace") ? val("genRace") : pick(data.races);
      const gender = userLocked.has("genGender") && val("genGender") ? val("genGender") : pick(data.genders);

      if(!userLocked.has("genRace")) setVal("genRace",race);
      if(!userLocked.has("genGender")) setVal("genGender",gender);
      if(!userLocked.has("genName")) setVal("genName",randomName(race,gender));
      if(!userLocked.has("genAge")) setVal("genAge",randomAge(race));
      if(!userLocked.has("genProfession")) setVal("genProfession",pick(data.professions));
      if(!userLocked.has("genAppearance")) setVal("genAppearance",pick(data.appearances));
      if(!userLocked.has("genCharacter")) setVal("genCharacter",pick(data.characters));
      if(!userLocked.has("genTrait")) setVal("genTrait",pick(data.traits));
      if(!userLocked.has("genAttitude")) setVal("genAttitude",pick(data.attitudes));
      if(!userLocked.has("genGoal")) setVal("genGoal",pick(data.goals));
      if(!userLocked.has("genSecret")) setVal("genSecret",pick(data.secrets));
      if(!userLocked.has("genVoice")) setVal("genVoice",pick(data.voices));
    }

    function getGeneratorNPC(){
      return {
        id:uid(), name:val("genName"), race:val("genRace"), gender:val("genGender"),
        age:val("genAge"), profession:val("genProfession"), appearance:val("genAppearance"),
        character:val("genCharacter"), trait:val("genTrait"), attitude:val("genAttitude"),
        location:val("genLocation"), status:val("genStatus") || "Жив",
        faction:val("genFaction"), tags:val("genTags"), goal:val("genGoal"),
        secret:val("genSecret"), voice:val("genVoice"), notes:val("genNotes"),
        favorite:false, archived:false
      };
    }

    function saveGeneratedNPC(){
      if(!val("genName")) generateNPC();
      const npc=getGeneratorNPC();
      if(!npc.name) return;
      npcs.unshift(npc); persist(); renderNPCs();
    }

    function clearGenerator(){
      ["genName","genRace","genGender","genAge","genProfession","genLocation","genAppearance",
       "genCharacter","genTrait","genAttitude","genFaction","genTags","genGoal",
       "genSecret","genVoice","genNotes"].forEach(id=>setVal(id,""));
      setVal("genStatus","Жив");
      userLocked.clear();
    }

    function toggleFavorite(id){
      const n=npcs.find(x=>x.id===id); if(!n)return;
      n.favorite=!n.favorite; persist(); renderNPCs();
    }
    function toggleArchive(id){
      const n=npcs.find(x=>String(x.id)===String(id)); if(!n)return;
      n.archived=!n.archived;
      persist();
      renderNPCs();
    }
    function removeNPC(id){
      npcs = npcs.filter(x => String(x.id) !== String(id));
      persist();
      renderNPCs();
    }

    function clearAllNPCs(){
      if(!npcs.length) return;
      document.getElementById("clearConfirm").classList.add("show");
    }

    function closeClearConfirm(){
      document.getElementById("clearConfirm").classList.remove("show");
    }

    function confirmClearAllNPCs(){
      npcs = [];
      persist();
      renderNPCs();
      closeClearConfirm();
    }
    function toggleCard(id){
      document.getElementById("card-"+id)?.classList.toggle("open");
    }
    function esc(s){
      return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }
    function saveEdit(id){
      const n=npcs.find(x=>x.id===id); if(!n)return;
      ["name","race","gender","age","profession","appearance","character","trait","attitude",
       "location","status","faction","tags","goal","secret","voice","notes"]
        .forEach(k=>n[k]=document.getElementById("edit-"+k+"-"+id).value.trim());
      persist(); renderNPCs();
    }

    function updateRaceFilter(){
      const select=document.getElementById("raceFilter");
      const current=select.value;
      const races=[...new Set(npcs.map(n=>n.race).filter(Boolean))].sort();
      select.innerHTML='<option value="">Все расы</option>'+races.map(r=>`<option>${esc(r)}</option>`).join("");
      select.value=current;
    }

    function renderNPCs(){
      updateRaceFilter();
      const q=val("npcSearch").toLowerCase();
      const race=val("raceFilter");
      const fav=val("favoriteFilter");
      const archive=val("archiveFilter");
      const filtered=npcs.filter(n=>{
        const name=(n.name||"").toLowerCase();
        const archiveOk = archive==="all" || (archive==="archived" ? !!n.archived : !n.archived);
        return (!q||name.includes(q)) &&
               (!race||n.race===race) &&
               (fav!=="favorites"||n.favorite) &&
               archiveOk;
      });

      const list=document.getElementById("npcList");
      if(!filtered.length){
        list.innerHTML='<div class="empty">Пока здесь никого нет. Создай или сгенерируй первого NPC.</div>';
        return;
      }

      list.innerHTML=filtered.map(n=>`
        <article class="npc-card ${n.archived?"archived":""}" id="card-${n.id}">
          <button class="npc-summary" type="button" onclick="toggleCard('${n.id}')">
            <span class="star">${n.favorite?"⭐":"☆"}</span>
            <span class="npc-main">
              <div class="npc-name">${esc(n.name||"Без имени")}${n.archived?'<span class="archive-badge">📦 Архив</span>':""}</div>
              <div class="npc-short">${esc([n.race,n.profession,n.attitude].filter(Boolean).join(" · "))}</div>
            </span>
            <span>⌄</span>
          </button>
          <div class="npc-details">
            <div class="details-grid">
              <div class="detail"><b>Пол:</b> ${esc(n.gender||"—")}</div>
              <div class="detail"><b>Возраст:</b> ${esc(n.age||"—")}</div>
              <div class="detail"><b>Локация:</b> ${esc(n.location||"—")}</div>
              <div class="detail"><b>Отношение:</b> ${esc(n.attitude||"—")}</div>
              <div class="detail"><b>Статус:</b> ${esc(n.status||"Жив")}</div>
              <div class="detail"><b>Фракция:</b> ${esc(n.faction||"—")}</div>
              <div class="detail wide"><b>Теги:</b> ${esc(n.tags||"—")}</div>
              <div class="detail wide"><b>🎯 Цель:</b> ${esc(n.goal||"—")}</div>
              <div class="detail wide"><b>🤫 Секрет:</b> ${esc(n.secret||"—")}</div>
              <div class="detail wide"><b>🎙️ Манера речи:</b> ${esc(n.voice||"—")}</div>
              <div class="detail wide"><b>Внешность:</b> ${esc(n.appearance||"—")}</div>
              <div class="detail wide"><b>Характер:</b> ${esc(n.character||"—")}</div>
              <div class="detail wide"><b>Особенность:</b> ${esc(n.trait||"—")}</div>
              <div class="detail wide"><b>Заметки:</b> ${esc(n.notes||"—")}</div>
            </div>

            <div class="actions">
              <button class="action-btn" onclick="toggleFavorite('${n.id}')">${n.favorite?"★ Убрать из избранного":"☆ В избранное"}</button>
              <button class="action-btn" onclick="toggleArchive('${n.id}')">${n.archived?"📤 Вернуть из архива":"📦 В архив"}</button>
              <button class="action-btn danger" onclick="removeNPC('${n.id}')">Удалить</button>
            </div>

            <div class="edit-title">✏️ Редактирование</div>
            <div class="edit-grid">
              ${editInput("name","Имя",n)}
              ${editInput("race","Раса",n)}
              ${editInput("gender","Пол",n)}
              ${editInput("age","Возраст",n)}
              ${editInput("profession","Профессия",n)}
              ${editInput("location","Локация",n)}
              ${editInput("appearance","Внешность",n,"wide")}
              ${editInput("character","Характер",n,"wide")}
              ${editInput("trait","Особенность",n,"wide")}
              ${editInput("attitude","Отношение",n,"wide")}
              ${editInput("status","Статус",n)}
              ${editInput("faction","Фракция",n)}
              ${editInput("tags","Теги",n,"wide")}
              ${editInput("goal","🎯 Цель / мотивация",n,"wide")}
              ${editInput("secret","🤫 Секрет",n,"wide")}
              ${editInput("voice","🎙️ Голос / манера речи",n,"wide")}
              <div class="field wide"><label>Заметки</label><textarea id="edit-notes-${n.id}">${esc(n.notes)}</textarea></div>
            </div>
            <div class="actions"><button class="action-btn primary" onclick="saveEdit('${n.id}')">💾 Сохранить изменения</button></div>
          </div>
        </article>`).join("");
    }

    function editInput(key,label,n,cls=""){
      return `<div class="field ${cls}"><label>${label}</label><input id="edit-${key}-${n.id}" value="${esc(n[key])}"></div>`;
    }

    document.getElementById("clearConfirm").addEventListener("click", function(event){
      if(event.target === this) closeClearConfirm();
    });

    renderNPCs();
  </script>


  <div class="confirm-overlay" id="clearConfirm" role="dialog" aria-modal="true" aria-labelledby="clearConfirmTitle">
    <div class="confirm-box">
      <h3 id="clearConfirmTitle">⚠️ Вы уверены?</h3>
      <p>Будут удалены все сохранённые NPC. Это действие нельзя отменить.</p>
      <div class="confirm-actions">
        <button class="action-btn danger" type="button" onclick="confirmClearAllNPCs()">Да, удалить всех</button>
        <button class="action-btn" type="button" onclick="closeClearConfirm()">Отмена</button>
      </div>
    </div>
  </div>

</body>
</html>
